# Course AI Tutor - Spring AI Backend Configuration

server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: course-ai-tutor-spring

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/course_ai_tutor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # SMTP for reminder notifications
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# Spring AI (DashScope OpenAI-compatible)
spring.ai:
  openai:
    api-key: ${DASHSCOPE_API_KEY:sk-8da7d7287c5041fa826519e06e420657}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    chat:
      options:
        model: ${AI_MODEL:qwen-plus}
        temperature: 0.7
        max-tokens: 4000

# App Configuration
app:
  jwt:
    secret: ${JWT_SECRET:course-ai-tutor-secret-key-for-jwt-token-generation-2024}
    expiration-ms: ${JWT_EXPIRES_IN_MS:3600000} # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRES_IN_MS:604800000} # 7 days

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3001,http://localhost:80}

  upload:
    dir: ${UPLOAD_DIR:./data/uploads}

  rag:
    service-url: ${RAG_SERVICE_URL:http://localhost:8083}

  ai:
    ocr-model: ${OCR_MODEL:qwen-vl-max-latest}
    stt-model: ${STT_MODEL:paraformer-realtime-v2}

  # Whitelist of domains that image URLs may target (SSRF prevention)
  allowed-image-domains:
    - dashscope.aliyuncs.com
    - oss-cn-hangzhou.aliyuncs.com
    - oss-cn-shanghai.aliyuncs.com
    - oss-cn-beijing.aliyuncs.com
    - oss-cn-shenzhen.aliyuncs.com

# Actuator
management:
  health:
    mail:
      enabled: false

# Spring Boot Admin / IDEA JMX
spring.jmx.enabled: true

# Logging
logging:
  level:
    com.example.coursetutor: INFO
    org.springframework.ai: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
