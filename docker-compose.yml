services:
  mysql:
    image: mysql:8.0
    container_name: course-ai-tutor-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-course_ai_tutor}
      MYSQL_USER: ${MYSQL_USER:-course_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_app_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./course-ai-tutor-backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - course-ai-tutor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./course-ai-tutor-backend
      dockerfile: Dockerfile
    container_name: course-ai-tutor-backend
    ports:
      - "8081:8081"
    env_file:
      - ./course-ai-tutor-backend/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8081
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-course_app}
      - DB_PASS=${MYSQL_PASSWORD:-course_app_password}
      - DB_NAME=${MYSQL_DATABASE:-course_ai_tutor}
    networks:
      - course-ai-tutor-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["sh", "-c", "su node -c 'node src/server.js'"]

  frontend:
    build:
      context: ./course-ai-tutor-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8081/api
        - VITE_RAG_BASE_URL=http://localhost:8083/api
    container_name: course-ai-tutor-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - course-ai-tutor-network
    restart: unless-stopped

  rag:
    build:
      context: ./course-ai-tutor-rag
      dockerfile: Dockerfile
    container_name: course-ai-tutor-rag
    ports:
      - "8083:8083"
    env_file:
      - ./course-ai-tutor-rag/.env
    environment:
      - PORT=8083
    volumes:
      - rag-data:/app/data
    networks:
      - course-ai-tutor-network
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R node:node /app/data && su node -c 'node src/server.js'"]

volumes:
  mysql-data:
    driver: local
  rag-data:
    driver: local

networks:
  course-ai-tutor-network:
    driver: bridge
